<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>iPhone Sensor Collector</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; }
        button { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; }
        textarea { width: 100%; height: 200px; margin-top: 15px; font-family: monospace; }
    </style>
</head>
<body>
    <h2>Urban Sensor Data Collector</h2>
    <p>Target: >1,000 data points</p>
    <button id="startBtn">Start Recording</button>
    <button id="stopBtn" disabled>Stop Recording</button>
    <p>Data points collected: <span id="counter">0</span></p>

    <h3>Your CSV Data (Copy below):</h3>
    <textarea id="output" placeholder="Your CSV data will appear here once you stop recording..."></textarea>

    <script>
        let sensorData = [];
        let isRecording = false;

        document.getElementById('startBtn').addEventListener('click', async () => {
            // iOS requires explicit permission for motion sensors
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const response = await DeviceMotionEvent.requestPermission();
                    if (response !== 'granted') {
                        alert("Sensor permission denied");
                        return;
                    }
                } catch (e) {
                    console.error(e);
                }
            }
            
            sensorData = [['timestamp', 'accel_x', 'accel_y', 'accel_z']];
            isRecording = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('output').value = "Recording in progress... Move your phone!";

            window.addEventListener('devicemotion', handleMotion);
        });

        function handleMotion(event) {
            if (!isRecording) return;
            
            const timestamp = new Date().toISOString();
            // Fallback to 0 if acceleration values are null
            const x = event.acceleration.x ? event.acceleration.x.toFixed(4) : 0;
            const y = event.acceleration.y ? event.acceleration.y.toFixed(4) : 0;
            const z = event.acceleration.z ? event.acceleration.z.toFixed(4) : 0;

            sensorData.push([timestamp, x, y, z]);
            document.getElementById('counter').innerText = sensorData.length - 1;
        }

        document.getElementById('stopBtn').addEventListener('click', () => {
            isRecording = false;
            window.removeEventListener('devicemotion', handleMotion);
            
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;

            // Convert array to CSV text string
            let csvContent = sensorData.map(e => e.join(",")).join("\n");
            
            // Display it in the text area so you can easily copy it
            document.getElementById('output').value = csvContent;
        });
    </script>
</body>
</html>
